name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Build
      uses: ./.github/workflows/build

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: |
          **/*.apk
